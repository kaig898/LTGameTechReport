<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LTGame Ops Center</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap');
        :root { --bg: #02040a; --text: #e2e8f0; --admin-gold: #f59e0b; --danger: #ff003c; --success: #39ff14; --folder-blue: #00f2ff; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 4px, 3px 100%; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding-bottom: 50px; }
        .header { text-align: center; margin-bottom: 10px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; letter-spacing: 5px; color: #fff; margin-bottom: 15px; text-transform: uppercase; transition: 0.3s; }
        .admin-active h1 { cursor: pointer; }
        .admin-active h1:hover { color: var(--admin-gold); text-shadow: 0 0 10px var(--admin-gold); }

        #admin-bar { display: none; background: rgba(245, 158, 11, 0.1); border: 1px solid var(--admin-gold); padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: center; }
        input, select { background: #000; border: 1px solid #334155; color: #fff; padding: 10px; margin: 5px; border-radius: 4px; font-family: 'Rajdhani'; width: 180px; }

        .nav-bar { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; font-family: 'Orbitron'; font-size: 0.9rem; }
        .nav-btn-home { background: var(--admin-gold); color: #000; padding: 6px 12px; cursor: pointer; border-radius: 4px; font-weight: bold; border: none; text-transform: uppercase; }
        
        #path-display { color: #aaa; letter-spacing: 1px; font-size: 0.9rem; }
        .path-link { color: var(--folder-blue); cursor: pointer; text-decoration: underline; }

        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 25px; }
        @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }

        .card { position: relative; aspect-ratio: 1/1; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; background: rgba(15, 23, 42, 0.7); border: 2px solid var(--c); }
        .card.folder { border-style: solid; box-shadow: inset 0 0 15px var(--c); }
        .card.report { border-style: dashed; background-image: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(57, 255, 20, 0.03) 3px, transparent 4px); }
        .card .name-text { font-family: 'Orbitron', sans-serif; font-size: 1.4rem; font-weight: 700; text-align: center; padding: 20px; z-index: 2; color: #fff; text-transform: uppercase; }

        .admin-btns { position: absolute; top: 8px; right: 8px; display: none; gap: 8px; z-index: 100; }
        .admin-active .admin-btns { display: flex; }
        .tool-btn { width: 34px; height: 34px; border-radius: 5px; display: flex; align-items: center; justify-content: center; border: 1px solid #fff; cursor: pointer; }
        .edit-btn { background: var(--admin-gold); color: #000; }
        .del-btn { background: var(--danger); color: #fff; }

        /* 黑色金邊彈窗風格 */
        #template-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-content { background: #0f172a; border: 2px solid var(--admin-gold); padding: 30px; border-radius: 12px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.8); width: 320px; }
        .modal-content h3 { font-family: 'Orbitron'; color: var(--admin-gold); margin-bottom: 20px; }
        .modal-content select { width: 100%; margin-bottom: 20px; border: 1px solid var(--admin-gold); }
        .modal-btn { padding: 10px 20px; border-radius: 4px; border: none; font-weight: bold; cursor: pointer; font-family: 'Orbitron'; }
        
        .type-tag { position: absolute; top: 12px; left: 12px; font-size: 0.65rem; padding: 3px 8px; background: #000; border-radius: 4px; font-family: 'Orbitron'; color: var(--c); border: 1px solid var(--c); font-weight: bold; z-index: 3; }
        .edit-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.98); display: flex; flex-direction: column; padding: 10px; gap: 5px; z-index: 200; border: 1px solid var(--admin-gold); overflow-y: auto; text-align: left; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="header-title" onclick="editGlobalConfig('title')">LTGAME MASTER OPS</h1>
        <div id="admin-bar">
            <input type="text" id="new-name" placeholder="Item Name">
            <button onclick="addItem('folder')" style="background:var(--folder-blue); color:#000; padding:10px 15px; border-radius:4px; font-weight:bold;">+ FOLDER</button>
            <button onclick="addItem('report')" style="background:var(--success); color:#000; padding:10px 15px; border-radius:4px; font-weight:bold;">+ REPORT</button>
            <button onclick="logoutAdmin()" style="background:#444; color:#fff; padding:10px; margin-left:10px; border-radius:4px;">EXIT ADMIN</button>
        </div>
        <div class="nav-bar">
            <button class="nav-btn-home" onclick="jumpTo(-1)">PROJECT</button>
            <div id="path-display"></div>
        </div>
    </div>
    <div id="view" class="grid"></div>
</div>

<!-- 下拉選單彈窗 -->
<div id="template-modal">
    <div class="modal-content">
        <h3>SELECT TEMPLATE</h3>
        <select id="tpl-dropdown"></select>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button class="modal-btn" style="background:var(--success); color:#000;" onclick="confirmAddReport()">OK</button>
            <button class="modal-btn" style="background:#444; color:#fff;" onclick="closeModal()">CANCEL</button>
        </div>
    </div>
</div>

<script>
    let isAdmin = localStorage.getItem('ltgame_token') === 'JASON_SECURE_TOKEN_2026';
    const firebaseConfig = { apiKey: "AIzaSyDRRJ7U-1HUOqXz5TJ7k9WY1EBmqvRy3jA", databaseURL: "https://g2e-macau-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // --- 模板清單配置位 ---
    // 你以後喺 templates 資料夾加咗新 file，只需要喺下面加名就得
    const TEMPLATE_LIST = [
        { name: "G2E Simple", path: "templates/G2E_Simple.html" },
        { name: "GV Simple", path: "templates/GV_Simple.html" },
        { name: "Master Macau", path: "G2E_Macau.html" }
    ];

    let allData = {}, path = [], tempName = "";

    db.ref('v15_data').on('value', s => { allData = s.val() || {}; render(); });

    function render() {
        const v = document.getElementById('view'); v.innerHTML = '';
        document.body.classList.toggle('admin-active', isAdmin);
        document.getElementById('admin-bar').style.display = isAdmin ? 'block' : 'none';
        let curr = allData;
        path.forEach(p => { if(curr[p]) curr = curr[p]; });
        
        const pathDiv = document.getElementById('path-display');
        pathDiv.innerHTML = "";
        path.forEach((p, i) => { pathDiv.innerHTML += ` > <span class="path-link" onclick="jumpTo(${i})">${p}</span>`; });

        Object.keys(curr).forEach(key => {
            if(key === '_meta') return;
            const item = curr[key], meta = item._meta || {}, isReport = meta.type === 'report';
            const color = meta.color || (isReport ? "#39ff14" : "#00f2ff");

            const div = document.createElement('div');
            div.className = `card ${isReport ? 'report' : 'folder'}`;
            div.style.setProperty('--c', color);
            div.onclick = (e) => {
                if (e.target.closest('.admin-btns') || e.target.closest('.edit-overlay')) return;
                if (isReport) { window.location.href = `${meta.targetHtml}?p=${path.join(',')}&v=${key}&admin=${isAdmin}`; }
                else { path.push(key); render(); }
            };
            div.innerHTML = `<div class="admin-btns"><div class="tool-btn edit-btn" onclick="showEdit(event,'${key}')">⚙️</div><div class="tool-btn del-btn" onclick="delItem(event,'${key}')">✕</div></div><div class="name-text">${key}</div>`;
            v.appendChild(div);
        });
    }

    function addItem(t) {
        if(!isAdmin) return;
        const n = document.getElementById('new-name').value.trim();
        if(!n) return;
        
        if(t === 'report') {
            tempName = n;
            const dropdown = document.getElementById('tpl-dropdown');
            dropdown.innerHTML = "";
            TEMPLATE_LIST.forEach(tpl => {
                dropdown.innerHTML += `<option value="${tpl.path}">${tpl.name}</option>`;
            });
            document.getElementById('template-modal').style.display = 'flex';
        } else {
            saveItem(n, 'folder', 'index.html');
        }
    }

    function confirmAddReport() {
        const selectedPath = document.getElementById('tpl-dropdown').value;
        saveItem(tempName, 'report', selectedPath);
        closeModal();
    }

    function saveItem(name, type, html) {
        let ref = db.ref('v15_data');
        path.forEach(p => ref = ref.child(p));
        ref.child(name).update({ _meta: { type: type, color: type==='report'?"#39ff14":"#00f2ff", targetHtml: html, displayLabel: type.toUpperCase() } });
        document.getElementById('new-name').value = '';
    }

    function closeModal() { document.getElementById('template-modal').style.display = 'none'; }
    function jumpTo(i) { path = path.slice(0, i + 1); render(); }
    function delItem(e, k) { e.stopPropagation(); if(confirm(`Delete ${k}?`)) { let r = db.ref('v15_data'); path.forEach(p=>r=r.child(p)); r.child(k).remove(); } }
    function logoutAdmin() { localStorage.removeItem('ltgame_token'); location.reload(); }
</script>
</body>
</html>
