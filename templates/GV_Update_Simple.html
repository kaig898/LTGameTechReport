<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GV Update Status</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap');
        :root { --bg: #02040a; --accent: #f59e0b; --success: #39ff14; --text: #e2e8f0; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 4px, 3px 100%; min-height: 100vh; }
        
        .header { background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(245, 158, 11, 0.3); padding: 20px; border-radius: 8px; margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        h2 { margin: 0; font-family: 'Orbitron'; color: var(--accent); letter-spacing: 2px; }
        .back-btn { background: #334155; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-family: 'Orbitron'; font-weight: bold; }

        .main-card { background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 30px; text-align: center; max-width: 600px; margin: 0 auto; }
        
        /* 數值輸入區域 */
        .status-display { margin-bottom: 30px; }
        .percent-val { font-family: 'Orbitron'; font-size: 4rem; font-weight: 900; color: var(--success); text-shadow: 0 0 20px rgba(57, 255, 20, 0.3); margin-bottom: 10px; }
        
        .progress-container { width: 100%; background: rgba(255,255,255,0.05); height: 24px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 30px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1); width: 0%; }

        .input-section { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 20px; }
        .input-box { text-align: center; }
        .input-box label { display: block; font-size: 0.8rem; color: #888; font-family: 'Orbitron'; margin-bottom: 8px; }
        
        input[type="number"] { background: #000; border: 2px solid var(--accent); color: #fff; font-family: 'Orbitron'; font-size: 2rem; width: 130px; text-align: center; border-radius: 8px; padding: 10px; outline: none; }
        input:focus { box-shadow: 0 0 15px var(--accent); }
        
        .divider { font-family: 'Orbitron'; font-size: 2rem; color: #444; padding-top: 25px; }
        .total-display { font-family: 'Orbitron'; font-size: 2rem; color: #fff; padding-top: 25px; }

        .save-btn { background: var(--success); color: #000; border: none; padding: 15px 50px; border-radius: 6px; font-weight: 900; font-family: 'Orbitron'; cursor: pointer; font-size: 1.1rem; transition: 0.3s; width: 100%; }
        .save-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(57, 255, 20, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <button class="back-btn" onclick="window.location.href='../index.html'">BACK</button>
        <h2 id="casino-title">CASINO NAME</h2>
        <div id="status-tag" style="font-family:'Orbitron'; font-size:0.8rem; color:var(--success);">LIVE DATA</div>
    </div>

    <div class="main-card">
        <div class="status-display">
            <div class="percent-val" id="percent-text">0%</div>
            <div class="progress-container">
                <div class="progress-fill" id="bar-fill"></div>
            </div>
        </div>

        <div class="input-section">
            <div class="input-box">
                <label>UPDATED UNITS</label>
                <input type="number" id="done-input" value="0" oninput="calculate()">
            </div>
            <div class="divider">/</div>
            <div class="input-box">
                <label>TOTAL MACHINES</label>
                <div class="total-display" id="total-text">0</div>
            </div>
        </div>

        <button class="save-btn" onclick="saveData()">SAVE STATUS</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDRRJ7U-1HUOqXz5TJ7k9WY1EBmqvRy3jA", databaseURL: "https://g2e-macau-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 解析 URL 參數
    const urlParams = new URLSearchParams(window.location.search);
    const venue = urlParams.get('v') || "Unknown";
    const rawP = urlParams.get('p') || "";
    const pathRef = rawP ? rawP.replace(/,/g, '/') + '/' + venue : venue;

    document.getElementById('casino-title').innerText = venue.toUpperCase().replace(/_/g, ' ');

    let totalVal = 0;

    // 1. 從 Firebase 獲取總機數 (meta 資料)
    db.ref('v15_data/' + pathRef + '/_meta').on('value', s => {
        const meta = s.val() || {};
        totalVal = parseInt(meta.totalMachines) || 0;
        document.getElementById('total-text').innerText = totalVal;
        
        // 2. 攞返之前儲低嘅更新數量
        db.ref('v15_data/' + pathRef + '/updated_count').once('value', s => {
            const count = s.val() || 0;
            document.getElementById('done-input').value = count;
            calculate();
        });
    });

    // 3. 即時計百分比同郁進度條
    function calculate() {
        const done = parseInt(document.getElementById('done-input').value) || 0;
        const per = totalVal > 0 ? Math.round((done / totalVal) * 100) : 0;
        
        // 限制唔過 100% (視覺上)
        const displayPer = per > 100 ? 100 : per;
        
        document.getElementById('percent-text').innerText = per + '%';
        document.getElementById('bar-fill').style.width = displayPer + '%';
        
        // 顏色變化
        if(per >= 100) document.getElementById('percent-text').style.color = 'var(--success)';
        else if(per > 0) document.getElementById('percent-text').style.color = 'var(--accent)';
    }

    // 4. 儲存數據
    function saveData() {
        const done = parseInt(document.getElementById('done-input').value) || 0;
        
        // 儲存實際數字到 Firebase
        db.ref('v15_data/' + pathRef + '/updated_count').set(done).then(() => {
            alert("Update successful!");
        });

        // 如果你想首頁嗰粒進度條都識郁，就要喺度順便寫一筆 tasks 紀錄
        // 呢度係一個 trick，等 index.html 以為你有機整好咗
        db.ref('v15_data/' + pathRef + '/tasks/global_stat').update({
            hw: done >= totalVal ? 'OK' : 'PND',
            sw: done >= totalVal ? 'OK' : 'PND'
        });
    }
</script>
</body>
</html>
