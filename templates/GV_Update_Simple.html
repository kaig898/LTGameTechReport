<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Casino Master Update Schedule</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap');
        :root { --bg: #02040a; --accent: #f59e0b; --success: #39ff14; --text: #e2e8f0; --card: rgba(15, 23, 42, 0.9); }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 15px; background-image: linear-gradient(rgba(18,16,16,0) 50%, rgba(0,0,0,0.25) 50%), linear-gradient(90deg, rgba(255,0,0,0.03), rgba(0,255,0,0.01), rgba(0,0,255,0.03)); background-size: 100% 4px, 3px 100%; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding-bottom: 60px; }
        
        .header-card { background: var(--card); border: 1px solid rgba(245,158,11,0.3); padding: 15px 20px; border-radius: 10px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 10px; z-index: 1000; }
        .back-btn { background: #334155; color: #fff; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-family: 'Orbitron'; font-size: 0.8rem; }
        
        #admin-panel { display: none; background: rgba(245,158,11,0.05); border: 2px solid var(--accent); padding: 20px; border-radius: 10px; margin-bottom: 20px; }
        .admin-active #admin-panel { display: block; }
        .admin-section { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .section-title { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--accent); margin-bottom: 10px; }

        input { background: #000; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 4px; font-family: 'Rajdhani'; margin-right: 5px; }
        
        .casino-row { position: relative; perspective: 1000px; margin-bottom: 15px; min-height: 80px; }
        .row-inner { position: relative; width: 100%; transition: transform 0.6s; transform-style: preserve-3d; cursor: pointer; }
        .row-inner.flipped { transform: rotateX(180deg); }
        
        .row-front, .row-back { position: absolute; width: 100%; backface-visibility: hidden; border-radius: 8px; box-sizing: border-box; }
        .row-front { background: var(--card); border: 1px solid rgba(255,255,255,0.1); padding: 15px 20px; display: flex; align-items: center; gap: 20px; z-index: 2; }
        .casino-name { font-family: 'Orbitron'; font-size: 1.1rem; width: 220px; color: #fff; overflow: hidden; text-overflow: ellipsis; }
        .prog-container { flex: 1; height: 14px; background: rgba(0,0,0,0.5); border-radius: 7px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--success)); transition: width 1s ease; }
        .count-display { font-family: 'Orbitron'; width: 160px; text-align: right; font-size: 0.9rem; }
        
        .row-back { background: #1e293b; transform: rotateX(180deg); padding: 15px 20px; z-index: 1; border: 1px solid var(--accent); min-height: 80px; }
        .log-list { font-size: 0.8rem; color: #aaa; max-height: 120px; overflow-y: auto; font-family: 'Rajdhani'; }
        .log-item { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 5px 0; display: flex; justify-content: space-between; }
        .log-time { color: var(--accent); width: 140px; }

        .del-btn { background: #ff003c; border: none; color: #fff; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 0.7rem; }
    </style>
</head>
<body>

<div class="container" id="app">
    <div class="header-card">
        <button class="back-btn" onclick="window.location.href='../index.html'">BACK</button>
        <h2 style="font-family:'Orbitron'; color:var(--accent); margin:0;">CASINO MASTER UPDATE</h2>
        <div id="clock" style="font-family:'Orbitron'; font-size:0.9rem; color:var(--success); text-shadow: 0 0 5px var(--success);"></div>
    </div>

    <div id="admin-panel">
        <!-- 基礎設定：只改一次名同總機數 -->
        <div class="admin-section">
            <div class="section-title">Step 1: Setup Casino & Total Units</div>
            <input type="text" id="setup-name" placeholder="Casino Name" style="width:250px;">
            <input type="number" id="setup-total" placeholder="Total Units" style="width:120px;">
            <button onclick="setupCasino()" style="background:#334155; color:#fff; border:none; padding:10px 15px; border-radius:4px; cursor:pointer;">SETUP</button>
        </div>

        <!-- 排程更新：多次增加更新機數 -->
        <div class="admin-section">
            <div class="section-title">Step 2: Add Update Schedule</div>
            <select id="select-casino" style="background:#000; color:#fff; padding:10px; border-radius:4px; width:180px; border:1px solid #444;"></select>
            <input type="datetime-local" id="sch-time">
            <input type="number" id="sch-qty" placeholder="Update Qty" style="width:100px;">
            <button onclick="addSchedule()" style="background:var(--success); border:none; padding:10px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">SAVE SCHEDULE</button>
        </div>
    </div>

    <div id="list"></div>
</div>

<script>
    let isAdmin = localStorage.getItem('ltgame_token') === 'JASON_SECURE_TOKEN_2026';
    const firebaseConfig = { apiKey: "AIzaSyDRRJ7U-1HUOqXz5TJ7k9WY1EBmqvRy3jA", databaseURL: "https://g2e-macau-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const venue = urlParams.get('v') || "Main";
    const rawP = urlParams.get('p') || "";
    const pathRef = rawP ? rawP.replace(/,/g, '/') + '/' + venue : venue;
    const dbRef = db.ref('v15_gv_update/' + pathRef);

    if(isAdmin) document.getElementById('app').classList.add('admin-active');

    setInterval(() => {
        const now = new Date();
        document.getElementById('clock').innerText = now.toLocaleString();
        autoProcessSchedules(); 
    }, 1000);

    let casinoData = {};

    dbRef.on('value', s => {
        casinoData = s.val() || {};
        updateSelectOptions();
        renderList();
    });

    // Step 1: 建立或修改基礎資料
    function setupCasino() {
        const name = document.getElementById('setup-name').value.trim();
        const total = parseInt(document.getElementById('setup-total').value) || 0;
        if(!name || total <= 0) return alert("Please enter name and total units.");
        
        dbRef.child(name).update({
            totalUnits: total,
            currentQty: casinoData[name] ? (casinoData[name].currentQty || 0) : 0
        });
        document.getElementById('setup-name').value = "";
        document.getElementById('setup-total').value = "";
    }

    // Step 2: 增加排程項目
    function addSchedule() {
        const name = document.getElementById('select-casino').value;
        const time = document.getElementById('sch-time').value;
        const qty = parseInt(document.getElementById('sch-qty').value) || 0;
        
        if(!name || !time || qty <= 0) return alert("Please select casino, time and quantity.");
        if(qty > casinoData[name].totalUnits) return alert("Update qty exceeds total machines!");

        const schID = Date.now();
        dbRef.child(name).child('schedules').child(schID).set({
            time: time,
            qty: qty,
            processed: false
        });
        alert("Schedule added!");
    }

    // 自動處理排程
    function autoProcessSchedules() {
        const now = new Date().getTime();
        Object.keys(casinoData).forEach(name => {
            const casino = casinoData[name];
            if(casino.schedules) {
                Object.keys(casino.schedules).forEach(id => {
                    const sch = casino.schedules[id];
                    const schTime = new Date(sch.time).getTime();
                    
                    if(!sch.processed && now >= schTime) {
                        // 時間到！更新主數據並紀錄 Log
                        const logMsg = `Updated to ${sch.qty} machines (Scheduled)`;
                        const logTime = new Date().toLocaleString();
                        
                        dbRef.child(name).update({ currentQty: sch.qty });
                        dbRef.child(name).child('logs').push({ time: logTime, msg: logMsg });
                        dbRef.child(name).child('schedules').child(id).update({ processed: true });
                    }
                });
            }
        });
    }

    function renderList() {
        const listDiv = document.getElementById('list');
        listDiv.innerHTML = "";
        Object.keys(casinoData).forEach(name => {
            const c = casinoData[name];
            const per = Math.round((c.currentQty / c.totalUnits) * 100) || 0;
            const logs = c.logs ? Object.values(c.logs).reverse() : [];

            const row = document.createElement('div');
            row.className = 'casino-row';
            row.innerHTML = `
                <div class="row-inner" onclick="this.classList.toggle('flipped')">
                    <div class="row-front">
                        <div class="casino-name">${name}</div>
                        <div class="prog-container"><div class="prog-fill" style="width:${per}%"></div></div>
                        <div class="count-display">${c.currentQty} / ${c.totalUnits} <span style="color:var(--success); margin-left:10px;">${per}%</span></div>
                        ${isAdmin ? `<button class="del-btn" onclick="event.stopPropagation(); deleteCasino('${name}')">✕</button>` : ''}
                    </div>
                    <div class="row-back">
                        <div class="section-title" style="margin-bottom:5px;">UPDATE LOGS (Click to flip back)</div>
                        <div class="log-list">
                            ${logs.map(l => `<div class="log-item"><span class="log-time">${l.time}</span><span>${l.msg}</span></div>`).join('')}
                            ${logs.length === 0 ? '<div style="color:#555">No logs yet.</div>' : ''}
                        </div>
                    </div>
                </div>
            `;
            listDiv.appendChild(row);
        });
    }

    function updateSelectOptions() {
        const sel = document.getElementById('select-casino');
        const currentVal = sel.value;
        sel.innerHTML = '<option value="">-- Select Casino --</option>';
        Object.keys(casinoData).forEach(name => {
            sel.innerHTML += `<option value="${name}">${name}</option>`;
        });
        sel.value = currentVal;
    }

    function deleteCasino(name) { if(confirm(`Delete ${name}?`)) dbRef.child(name).remove(); }
</script>
</body>
</html>
