<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Version Status</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Rajdhani:wght@600;700&display=swap');
        :root { --bg: #02040a; --text: #e2e8f0; --admin-gold: #f59e0b; --success: #39ff14; --folder-blue: #00f2ff; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); background-size: 100% 4px, 3px 100%; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; padding-bottom: 50px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        h1 { font-family: 'Orbitron', sans-serif; font-size: 1.8rem; letter-spacing: 5px; color: #fff; text-transform: uppercase; }
        
        #admin-bar { display: none; background: rgba(245, 158, 11, 0.1); border: 1px solid var(--admin-gold); padding: 15px; border-radius: 4px; margin-bottom: 20px; text-align: center; }
        input { background: #000; border: 1px solid #334155; color: #fff; padding: 10px; margin: 5px; border-radius: 4px; font-family: 'Rajdhani'; width: 200px; }
        
        /* 1行1個嘅列表樣式 */
        .casino-list { display: flex; flex-direction: column; gap: 15px; }
        .casino-row { position: relative; background: rgba(15, 23, 42, 0.8); border-left: 4px solid var(--c); padding: 15px 20px; border-radius: 4px; cursor: pointer; transition: 0.3s; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .casino-row:hover { background: rgba(30, 41, 59, 0.9); }
        
        .info-part { flex: 1; }
        .name-text { font-family: 'Orbitron'; font-size: 1.1rem; color: #fff; margin-bottom: 5px; }
        
        .progress-part { flex: 2; display: flex; align-items: center; gap: 15px; }
        .p-bar-bg { flex: 1; background: rgba(255,255,255,0.05); height: 12px; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .p-bar-fill { height: 100%; background: linear-gradient(90deg, var(--admin-gold), var(--success)); transition: width 0.5s; }
        .p-percent { font-family: 'Orbitron'; font-size: 0.9rem; color: var(--success); width: 50px; text-align: right; }
        
        .stats-part { font-family: 'Orbitron'; font-size: 0.8rem; color: #888; white-space: nowrap; }

        .admin-btns { display: none; gap: 10px; margin-left: 10px; }
        .admin-active .admin-btns { display: flex; }
        .tool-btn { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; }
        
        /* 下拉選單彈窗 */
        #template-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 3000; }
        .modal-content { background: #0f172a; border: 2px solid var(--admin-gold); padding: 30px; border-radius: 12px; text-align: center; width: 320px; }
        
        .edit-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.98); display: flex; flex-direction: row; align-items: center; padding: 0 20px; gap: 15px; z-index: 200; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>CASINO UPDATE STATUS</h1>
        <div id="admin-bar">
            <input type="text" id="new-name" placeholder="Casino Name">
            <button onclick="addItem('report')" style="background:var(--success); color:#000; padding:10px 20px; border-radius:4px; font-weight:bold; border:none; cursor:pointer;">+ ADD CASINO</button>
            <button onclick="logoutAdmin()" style="background:#444; color:#fff; padding:10px; border:none; border-radius:4px; cursor:pointer; margin-left:10px;">EXIT</button>
        </div>
    </div>
    
    <div id="view" class="casino-list"></div>
</div>

<div id="template-modal">
    <div class="modal-content">
        <h3 style="font-family:'Orbitron'; color:var(--admin-gold);">SELECT TEMPLATE</h3>
        <select id="tpl-dropdown" style="width:100%; margin-bottom:20px;"></select>
        <div style="display:flex; gap:10px; justify-content:center;">
            <button onclick="confirmAddReport()" style="background:var(--success); padding:10px 20px; border:none; border-radius:4px; font-weight:bold;">OK</button>
            <button onclick="closeModal()" style="background:#444; color:#fff; padding:10px 20px; border:none; border-radius:4px;">CANCEL</button>
        </div>
    </div>
</div>

<script>
    let isAdmin = localStorage.getItem('ltgame_token') === 'JASON_SECURE_TOKEN_2026';
    const firebaseConfig = { apiKey: "AIzaSyDRRJ7U-1HUOqXz5TJ7k9WY1EBmqvRy3jA", databaseURL: "https://g2e-macau-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const GH_REPO = "kaig898/LTGameTechReport";

    let allData = {}, tempName = "";

    db.ref('v15_data').on('value', s => { allData = s.val() || {}; render(); });

    function render() {
        const v = document.getElementById('view'); v.innerHTML = '';
        document.body.classList.toggle('admin-active', isAdmin);
        document.getElementById('admin-bar').style.display = isAdmin ? 'block' : 'none';

        Object.keys(allData).forEach(key => {
            if(key === '_meta') return;
            const item = allData[key], meta = item._meta || {};
            
            let finished = 0, total = parseInt(meta.totalMachines) || 0;
            if(item.tasks) {
                Object.values(item.tasks).forEach(t => { if(t.hw === 'OK' && t.sw === 'OK') finished++; });
            }
            const percent = total > 0 ? Math.round((finished / total) * 100) : 0;
            const color = percent >= 100 ? "#39ff14" : (percent > 0 ? "#f59e0b" : "#00f2ff");

            const div = document.createElement('div');
            div.className = 'casino-row';
            div.style.setProperty('--c', color);
            div.onclick = (e) => {
                if (e.target.closest('.admin-btns') || e.target.closest('.edit-overlay')) return;
                window.location.href = `${meta.targetHtml}?v=${key}&admin=${isAdmin}`;
            };
            
            div.innerHTML = `
                <div class="info-part">
                    <div class="name-text">${key}</div>
                </div>
                <div class="progress-part">
                    <div class="p-bar-bg"><div class="p-bar-fill" style="width:${percent}%"></div></div>
                    <div class="p-percent">${percent}%</div>
                </div>
                <div class="stats-part">${finished} / ${total} UNITS</div>
                <div class="admin-btns">
                    <button class="tool-btn" style="background:var(--admin-gold)" onclick="showEdit(event,'${key}')">⚙️</button>
                    <button class="tool-btn" style="background:var(--danger); color:#fff;" onclick="delItem(event,'${key}')">✕</button>
                </div>
            `;
            v.appendChild(div);
        });
    }

    async function addItem(t) {
        if(!isAdmin) return;
        const n = document.getElementById('new-name').value.trim();
        if(!n) return;
        tempName = n;
        document.getElementById('template-modal').style.display = 'flex';
        const res = await fetch(`https://api.github.com/repos/${GH_REPO}/contents/templates`);
        const files = await res.json();
        const dropdown = document.getElementById('tpl-dropdown');
        dropdown.innerHTML = "";
        files.forEach(f => { if(f.name.endsWith('.html')) dropdown.innerHTML += `<option value="templates/${f.name}">${f.name}</option>`; });
    }

    function confirmAddReport() {
        const tpl = document.getElementById('tpl-dropdown').value;
        const total = prompt("ENTER TOTAL MACHINES:", "10");
        db.ref('v15_data/' + tempName).update({ _meta: { type:'report', targetHtml: tpl, totalMachines: total || 0 } });
        document.getElementById('new-name').value = '';
        closeModal();
    }

    function showEdit(e, key) {
        e.stopPropagation();
        const parent = e.target.closest('.casino-row');
        const meta = allData[key]._meta || {};
        const overlay = document.createElement('div');
        overlay.className = 'edit-overlay';
        overlay.innerHTML = `
            <input type="text" id="ed-n" value="${key}" style="width:150px">
            <input type="number" id="ed-total" value="${meta.totalMachines || 0}" style="width:80px">
            <button onclick="saveEdit(event, '${key}')" style="background:var(--success); color:#000; padding:8px 15px; border:none; border-radius:4px; font-weight:bold;">SAVE</button>
            <button onclick="this.parentElement.remove()" style="background:#444; color:#fff; padding:8px 15px; border:none; border-radius:4px;">CANCEL</button>
        `;
        parent.appendChild(overlay);
    }

    function saveEdit(e, oldKey) {
        const newN = document.getElementById('ed-n').value.trim();
        const newTotal = document.getElementById('ed-total').value;
        if(!newN) return;
        db.ref('v15_data/' + oldKey).once('value', s => {
            let val = s.val() || {}; if(!val._meta) val._meta = {};
            val._meta.totalMachines = newTotal;
            db.ref('v15_data/' + newN).set(val);
            if(newN !== oldKey) db.ref('v15_data/' + oldKey).remove();
        });
    }

    function closeModal() { document.getElementById('template-modal').style.display = 'none'; }
    function delItem(e, k) { e.stopPropagation(); if(confirm(`Delete ${k}?`)) db.ref('v15_data/' + k).remove(); }
    function logoutAdmin() { localStorage.removeItem('ltgame_token'); location.reload(); }
</script>
</body>
</html>
